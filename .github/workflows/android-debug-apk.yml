name: PageNest Android Builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pagenest-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK, release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Restore permanent release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate first-use release signing key
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        shell: bash
        run: |
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$STORE_PASSWORD"
          KEY_ALIAS="pagenest-upload"
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -dname "CN=PageNest Upload,O=PageNest,C=IR" \
            -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          mkdir -p signing-bootstrap
          cp my-upload-key.jks signing-bootstrap/
          cat > signing-bootstrap/README-KEEP-PRIVATE.txt <<EOF
          PAGENEST RELEASE SIGNING KEY — KEEP PRIVATE

          This keystore signed the release APK and AAB from this workflow run.
          Never lose it. Every future update must use this exact keystore.

          GitHub Actions repository secrets to create:
          ANDROID_KEYSTORE_BASE64 = Base64 encoding of my-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD = $STORE_PASSWORD
          ANDROID_KEY_ALIAS = $KEY_ALIAS
          ANDROID_KEY_PASSWORD = $KEY_PASSWORD

          Windows PowerShell (run in the folder containing my-upload-key.jks):
          \$bytes = [IO.File]::ReadAllBytes("my-upload-key.jks")
          \$base64 = [Convert]::ToBase64String(\$bytes)
          Set-Clipboard \$base64

          Then add the four values in:
          GitHub repository > Settings > Secrets and variables > Actions > New repository secret

          After confirming all four secrets exist, delete this bootstrap artifact from
          Actions > this run > Artifacts. Store a separate encrypted offline backup.
          EOF

      - name: Upload first-use signing key (PRIVATE)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: PageNest-signing-key-BOOTSTRAP-PRIVATE
          path: signing-bootstrap/*
          if-no-files-found: error
          retention-days: 1

      - name: Build all Android release variants
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Prepare clearly named deliverables
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION="${VERSION_NAME:-unknown}-${VERSION_CODE:-0}"
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/*.apk "deliverables/PageNest-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "deliverables/PageNest-${VERSION}-release.apk"
          cp app/build/outputs/bundle/release/*.aab "deliverables/PageNest-${VERSION}-release.aab"
          (cd deliverables && sha256sum * > SHA256SUMS.txt)
          {
            echo "## PageNest build outputs"
            echo
            echo "- Version: `$VERSION`"
            echo "- Debug APK: install for personal testing; not for store publication."
            echo "- Release APK: signed production APK; use this for Myket if its panel requests APK."
            echo "- Release AAB: signed Android App Bundle; keep for stores/pipelines that request AAB."
            echo
            echo "All three outputs were built from commit ${GITHUB_SHA}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PageNest-debug-APK
          path: deliverables/*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload official release APK
        uses: actions/upload-artifact@v4
        with:
          name: PageNest-release-APK
          path: deliverables/*-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: PageNest-release-AAB
          path: deliverables/*-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: PageNest-build-checksums
          path: deliverables/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Verify signing and output files
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose deliverables/*-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose deliverables/*-release.apk
          test -s deliverables/*.aab
          cat deliverables/SHA256SUMS.txt
